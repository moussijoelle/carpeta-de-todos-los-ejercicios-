<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios Varios — Limpieza de edificios</title>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    @media (max-width: 1023px) {
      body {
        padding-bottom: 11.5rem;
      }
    }
  </style>
</head>
<body class="min-h-screen bg-[url('img/bg.webp')] bg-cover bg-center bg-fixed bg-no-repeat p-4 font-['Urbanist',sans-serif] text-base-content">

  <div class="mx-auto w-full max-w-[88rem]">

    <header id="page-header" class="mb-4 flex flex-wrap items-center justify-between gap-3 rounded-2xl bg-base-100/90 px-4 py-3 shadow-lg backdrop-blur-sm">
      <h1 id="titulo-principal" class="min-w-0 flex-1 text-center text-2xl font-extrabold tracking-wide md:text-3xl">
        Servicios Varios — Limpieza de edificios
      </h1>

      <label class="swap swap-rotate btn btn-ghost btn-circle btn-lg size-16 shrink-0 p-0" title="Cambiar entre light y night">
        <input type="checkbox" class="theme-controller" value="night" id="theme-toggle" aria-label="Tema light o night" />
        <svg class="swap-off size-10 fill-current text-amber-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.36Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41l-.71.71a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
        </svg>
        <svg class="swap-on size-10 fill-current text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
        </svg>
      </label>
    </header>

    <div class="grid grid-cols-1 items-stretch gap-5 lg:grid-cols-[1.2fr_0.8fr] lg:gap-6">

      <!-- Zona carrusel -->
      <section
        id="zona-carrusel"
        class="flex min-h-[40rem] flex-col rounded-2xl bg-base-100/90 p-5 shadow-lg backdrop-blur-sm lg:min-h-[calc(100vh-10rem)]"
        aria-label="Carrusel de edificios"
      >
        <h2 class="mb-3 shrink-0 text-center text-xl font-bold">Nuestros edificios</h2>

        <figure class="relative mb-4 min-h-[22rem] flex-1 overflow-hidden rounded-2xl bg-base-200 shadow-inner sm:min-h-[26rem] lg:min-h-0">
          <img
            id="carousel-imagen"
            src="img/edificio1.jpg"
            alt="Foto del edificio"
            class="absolute inset-0 h-full w-full object-cover object-center"
          />
        </figure>

        <div id="carousel-datos" class="mb-3 shrink-0 space-y-1 text-center">
          <h3 id="carousel-nombre" class="text-xl font-extrabold lg:text-2xl">—</h3>
          <p id="carousel-plantas" class="text-base-content/80">Plantas: —</p>
          <p id="carousel-superficie" class="text-base-content/80">Superficie: —</p>
          <p id="carousel-coste" class="font-semibold text-primary">Coste mensual: —</p>
        </div>

        <nav class="flex shrink-0 items-center justify-between gap-2" aria-label="Navegación del carrusel">
          <div class="flex gap-2">
            <button id="btn-first" type="button" class="btn btn-circle btn-sm btn-neutral shadow-md" aria-label="Primero">«</button>
            <button id="btn-prev" type="button" class="btn btn-circle btn-sm btn-neutral shadow-md" aria-label="Anterior">‹</button>
          </div>
          <p id="carousel-indice" class="text-sm font-medium text-base-content/70">0 / 0</p>
          <div class="flex gap-2">
            <button id="btn-next" type="button" class="btn btn-circle btn-sm btn-neutral shadow-md" aria-label="Siguiente">›</button>
            <button id="btn-last" type="button" class="btn btn-circle btn-sm btn-neutral shadow-md" aria-label="Último">»</button>
          </div>
        </nav>
      </section>

      <!-- Zona administrador -->
      <section
        id="zona-admin"
        class="flex min-h-[32rem] flex-col rounded-2xl bg-base-100/90 p-5 shadow-lg backdrop-blur-sm lg:min-h-[calc(100vh-10rem)] lg:overflow-y-auto"
        aria-label="Gestión de edificios"
      >
        <h2 class="mb-3 text-center text-xl font-bold">Administración</h2>

        <div
          id="barra-acciones"
          class="fixed inset-x-0 bottom-0 z-40 border-t border-base-300 bg-base-100/95 px-3 py-2 shadow-[0_-4px_20px_rgba(0,0,0,0.12)] backdrop-blur-md lg:static lg:z-auto lg:mb-3 lg:border-0 lg:bg-transparent lg:p-0 lg:shadow-none lg:backdrop-blur-none"
        >
          <nav class="mx-auto flex max-w-[88rem] flex-wrap justify-center gap-1.5 lg:gap-2" aria-label="Operaciones CRUD">
            <button
              id="btn-agregar"
              type="button"
              data-operacion="1"
              class="btn-operacion shrink-0 rounded-lg bg-gradient-to-br from-green-400 to-blue-600 px-3 py-2 text-center text-xs font-medium leading-4 text-white hover:bg-gradient-to-bl focus:outline-none focus:ring-4 focus:ring-green-200 lg:px-4 lg:py-2.5 lg:text-sm lg:leading-5"
            >Agregar</button>
            <button
              id="btn-modificar"
              type="button"
              data-operacion="2"
              class="btn-operacion shrink-0 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 px-3 py-2 text-center text-xs font-medium leading-4 text-white hover:bg-gradient-to-l focus:outline-none focus:ring-4 focus:ring-purple-200 lg:px-4 lg:py-2.5 lg:text-sm lg:leading-5"
            >Modificar</button>
            <button
              id="btn-eliminar"
              type="button"
              data-operacion="3"
              class="btn-operacion shrink-0 rounded-lg bg-gradient-to-br from-pink-500 to-orange-400 px-3 py-2 text-center text-xs font-medium leading-4 text-white hover:bg-gradient-to-bl focus:outline-none focus:ring-4 focus:ring-pink-200 lg:px-4 lg:py-2.5 lg:text-sm lg:leading-5"
            >Eliminar</button>
            <button
              id="btn-mostrar"
              type="button"
              data-operacion="4"
              class="btn-operacion shrink-0 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-500 px-3 py-2 text-center text-xs font-medium leading-4 text-white hover:bg-gradient-to-bl focus:outline-none focus:ring-4 focus:ring-cyan-300 lg:px-4 lg:py-2.5 lg:text-sm lg:leading-5"
            >Mostrar</button>
            <button
              id="btn-listar"
              type="button"
              class="shrink-0 rounded-lg bg-gradient-to-r from-teal-500 to-emerald-600 px-3 py-2 text-center text-xs font-medium leading-4 text-white hover:bg-gradient-to-bl focus:outline-none focus:ring-4 focus:ring-teal-200 lg:px-4 lg:py-2.5 lg:text-sm lg:leading-5"
            >Listar todos</button>
            <button
              id="btn-coste-total"
              type="button"
              class="shrink-0 rounded-lg bg-gradient-to-r from-amber-500 to-orange-500 px-3 py-2 text-center text-xs font-medium leading-4 text-white hover:bg-gradient-to-bl focus:outline-none focus:ring-4 focus:ring-amber-200 lg:px-4 lg:py-2.5 lg:text-sm lg:leading-5"
            >Coste total</button>
            <button
              id="btn-aceptar"
              type="button"
              class="btn btn-primary btn-sm shrink-0 px-3 lg:btn-md lg:px-4"
            >Aceptar</button>
            <button
              id="btn-limpiar"
              type="button"
              class="btn btn-outline btn-sm shrink-0 px-3 lg:btn-md lg:px-4"
            >Limpiar</button>
          </nav>
        </div>

        <div class="card min-w-0 flex-1 bg-base-200/50 shadow-sm">
          <div class="card-body gap-3 p-4">
            <form id="form-edificios" class="flex min-w-0 flex-col gap-3">
              <fieldset id="datos" class="flex min-w-0 flex-col gap-3 rounded-lg border border-base-300 p-3">
                <legend class="px-1 text-sm font-medium">Datos del edificio</legend>

                <label class="grid w-full grid-cols-[5.5rem_minmax(0,1fr)] items-center gap-3">
                  <span class="text-sm font-medium">Nombre:</span>
                  <input type="text" id="input-nombre" name="nombre" class="input input-bordered input-md min-w-0 w-full bg-amber-50" placeholder="Ej: Torre Norte">
                </label>

                <label class="grid w-full grid-cols-[5.5rem_minmax(0,1fr)] items-center gap-3">
                  <span class="text-sm font-medium">Plantas:</span>
                  <input type="number" id="input-plantas" name="plantas" class="input input-bordered input-md min-w-0 w-full" min="1" value="1">
                </label>

                <label class="grid w-full grid-cols-[5.5rem_minmax(0,1fr)] items-center gap-3">
                  <span class="text-sm font-medium">Superficie:</span>
                  <input type="number" id="input-superficie" name="superficie" class="input input-bordered input-md min-w-0 w-full" min="1" placeholder="Ej: 150">
                </label>
              </fieldset>

              <p class="text-xs text-base-content/60">
                Clica sobre el botón Aceptar para guardar los datos.
              </p>
            </form>
          </div>
        </div>

        <div class="mt-3 flex-1">
          <h3 class="mb-2 text-sm font-semibold">Resultado</h3>
          <pre id="salida" class="min-h-24 whitespace-pre-wrap rounded-lg bg-base-200 p-3 text-sm"></pre>
        </div>

      </section>

    </div>
  </div>

  <dialog id="dialog-resultado" class="modal">
    <div class="modal-box max-w-lg">
      <button
        id="btn-cerrar-dialogo"
        type="button"
        class="btn btn-circle btn-ghost btn-sm absolute right-3 top-3"
        aria-label="Cerrar"
      >✕</button>
      <h3 class="text-lg font-bold">Resultado</h3>
      <pre id="dialog-mensaje" class="mt-3 whitespace-pre-wrap text-sm leading-relaxed"></pre>
      <div class="modal-action">
        <button id="btn-cerrar-dialogo-footer" type="button" class="btn btn-primary">Cerrar</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop">
      <button type="submit" aria-label="Cerrar diálogo">cerrar</button>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
