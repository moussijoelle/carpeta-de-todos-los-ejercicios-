<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @import "tailwindcss";

    @layer base {
      :root {
        @apply text-sm;
        line-height: 1.6;
      }

      p {
        @apply mb-2;
      }

      button {
        @apply rounded-md border border-slate-400 px-4 py-2 my-1 text-sm cursor-pointer disabled:opacity-50 transition hover:opacity-90;
      }

      input {
        @apply border border-slate-300 rounded-md px-3 py-2 w-full;
      }

      ol {
        @apply list-decimal list-outside ml-6 mb-4 space-y-2;
      }

      kbd, code, a {
        @apply text-blue-800;
      }
    }
  </style>

  <link rel="shortcut icon" href="shopping-cart.svg" type="image/svg+xml">
  <title>🍅 Compras</title>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-100 to-white">
  <main class="w-full max-w-5xl mx-auto px-4 sm:px-6 py-8">

    <header class="mb-8 text-center md:text-left">
      <h1 class="font-bold text-2xl sm:text-3xl md:text-4xl leading-tight">
        😊 Compra Sin Drama — tu lista de compra 🛒
      </h1>
    </header>

    <section
      class="bg-white/80 backdrop-blur rounded-xl border border-slate-200 p-4 sm:p-6 shadow-sm mb-6"
      aria-label="Añadir producto"
    >
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
        <div class="sm:col-span-2 lg:col-span-1">
          <label class="block font-medium mb-1" for="producto-input">Producto</label>
          <input type="text" id="producto-input" placeholder="Ej: Pan" autocomplete="off">
        </div>

        <div>
          <label class="block font-medium mb-1" for="cantidad-input">Cantidad</label>
          <input type="number" id="cantidad-input" min="1" value="1" placeholder="1">
        </div>

        <div>
          <label class="block font-medium mb-1" for="precio-input">Precio estimado (€)</label>
          <input type="number" id="precio-input" min="0" step="0.01" placeholder="0.00">
        </div>

        <button type="button" id="btn-agregar" class="w-full bg-blue-600 text-white border-blue-700">
          Agregar
        </button>
      </div>
    </section>

    <section class="flex flex-col sm:flex-row flex-wrap gap-2 mb-6">
      <button type="button" id="btn-calcular" class="bg-emerald-600 text-white border-emerald-700">
        Calcular estimado a gastar
      </button>
      <button type="button" id="btn-vaciar" class="bg-red-600 text-white border-red-700">
        Vaciar carrito
      </button>
    </section>

    <section class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      <article class="bg-white rounded-xl border border-slate-200 p-4 min-h-[200px]">
        <h2 class="font-semibold text-lg mb-3">Tu lista</h2>
        <ol id="lista-compras" class="text-slate-800"></ol>
        <p id="mensaje" class="italic text-slate-600 mt-4 min-h-[1.5rem]">&nbsp;</p>
      </article>

      <aside class="text-center bg-white rounded-xl border border-slate-200 p-4">
        <img
          class="mx-auto w-full max-w-xs sm:max-w-sm"
          src="img/compra.webp"
          alt="Ilustración de un carrito de la compra"
        >
        <p class="mt-4">
          Productos en el carrito:
          <span class="font-bold text-red-700" id="num-prod">0</span>
        </p>
        <p class="mt-4 text-base text-slate-700">
          Total estimado a gastar:
        </p>
        <p class="text-3xl sm:text-4xl font-bold text-emerald-600" id="total-estimado">
          0,00 €
        </p>
      </aside>
    </section>

  </main>

  <script src="app.js"></script>
</body>

</html>
