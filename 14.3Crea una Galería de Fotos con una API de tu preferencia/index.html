<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    if (localStorage.getItem("theme") === "dark") {
      document.documentElement.classList.add("dark");
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
  <title>Galería de Fotos</title>
</head>
<body class="min-h-screen bg-neutral-100 font-['Verdana','Arial',sans-serif] text-neutral-900 transition-colors dark:bg-neutral-900 dark:text-neutral-100">

  <header class="relative border-b border-neutral-200 bg-white px-4 py-8 text-center dark:border-neutral-700 dark:bg-neutral-800">
    <button
      id="theme-toggle"
      type="button"
      class="absolute right-4 top-4 rounded-lg border border-neutral-300 bg-neutral-100 px-3 py-1.5 text-sm transition hover:bg-neutral-200 dark:border-neutral-600 dark:bg-neutral-700 dark:hover:bg-neutral-600"
      aria-label="Cambiar a modo noche"
    >
      🌙 Noche
    </button>

    <h1 class="text-2xl font-bold sm:text-3xl">Galería de Fotos</h1>
    <p class="mx-auto mt-3 max-w-xl text-sm text-neutral-600 dark:text-neutral-400 sm:text-base">
      Explora miles de imágenes y elige el tema que quieras. Cada visita puede ser distinta.
    </p>

    <form id="search-form" class="mx-auto mt-6 flex max-w-xl flex-wrap justify-center gap-2">
      <input
        type="search"
        id="search-input"
        placeholder="Busca un tema: viajes, playa, arquitectura..."
        class="w-full min-w-0 flex-1 rounded-lg border border-neutral-300 bg-white px-3 py-2 text-neutral-900 focus:border-[#58008b] focus:outline-none focus:ring-2 focus:ring-[#58008b]/30 dark:border-neutral-600 dark:bg-neutral-700 dark:text-neutral-100 dark:placeholder-neutral-400 sm:min-w-[280px]"
      >
      <button
        type="submit"
        class="rounded-lg bg-[#58008b] px-5 py-2 text-white transition hover:bg-[#45006e]"
      >
        Buscar
      </button>
    </form>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <p id="status" class="mb-4 text-center text-neutral-600 dark:text-neutral-400" aria-live="polite"></p>

    <section
      id="gallery"
      class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    ></section>

    <button
      id="load-more"
      hidden
      class="mx-auto mt-8 block rounded-lg bg-[#58008b] px-6 py-2 text-white transition hover:bg-[#45006e] disabled:cursor-not-allowed disabled:opacity-50"
    >
      Cargar más
    </button>
  </main>

  <footer class="border-t border-neutral-200 bg-white px-4 py-4 text-center text-sm text-neutral-500 dark:border-neutral-700 dark:bg-neutral-800 dark:text-neutral-400">
    Fotos de
    <a href="https://unsplash.com" class="text-[#58008b] underline hover:no-underline dark:text-purple-300" target="_blank" rel="noopener noreferrer">Unsplash</a>.
    Cada imagen incluye el nombre del autor.
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
