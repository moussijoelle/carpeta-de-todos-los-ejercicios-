<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario sobre HTML</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @import "tailwindcss";

    @theme {
      --font-sans: ui-sans-serif, system-ui, sans-serif;
      --color-brand: #1e40af;
    }

    @layer base {
      body {
        @apply min-h-screen bg-cover bg-center bg-fixed text-slate-800;
        background-image: url("img/bg.webp");
      }

      label {
        @apply flex items-center gap-3 rounded-lg border border-slate-200 bg-white/70 px-4 py-3 cursor-pointer;
      }

      input[type="radio"] {
        @apply h-4 w-4 accent-brand;
      }

      button {
        @apply rounded border border-slate-300 px-3 py-2 text-sm font-bold bg-white/90 shadow;
      }
    }
  </style>
</head>

<body>
  <div class="container mx-auto max-w-2xl px-4 py-8">
    <div id="vista-test" class="rounded-2xl bg-white/85 px-8 py-6 shadow-xl backdrop-blur-sm">
      <h1 class="text-2xl font-bold text-center text-brand mb-1">Cuestionario sobre HTML</h1>
      <p id="contador" class="text-center text-sm text-slate-500 mb-6">Pregunta 1 de 20</p>

      <p id="enunciado" class="font-semibold text-lg mb-4">
        ¿Cuál es el código HTML correcto para un salto de línea?
      </p>

      <div id="opciones" class="space-y-2 mb-6">
        <label>
          <input type="radio" name="respuesta" value="a">
          <span id="op-a">a. &lt;br&gt;</span>
        </label>
        <label>
          <input type="radio" name="respuesta" value="b">
          <span id="op-b">b. &lt;break/&gt;</span>
        </label>
        <label>
          <input type="radio" name="respuesta" value="c">
          <span id="op-c">c. &lt;/p&gt;</span>
        </label>
        <label>
          <input type="radio" name="respuesta" value="d">
          <span id="op-d">d. &lt;hr&gt;</span>
        </label>
      </div>

      <p class="flex flex-wrap justify-center gap-2">
        <button type="button" id="btn-anterior">PREGUNTA ANTERIOR</button>
        <button type="button" id="btn-verificar" class="bg-brand text-white border-brand">VERIFICAR</button>
        <button type="button" id="btn-siguiente">PREGUNTA SIGUIENTE</button>
        <button type="button" id="btn-reiniciar">REINICIAR TEST</button>
      </p>
    </div>

    <div id="vista-resultados" class="hidden mt-6 rounded-2xl bg-white/85 px-8 py-6 shadow-xl backdrop-blur-sm">
      <h2 class="text-xl font-bold text-center text-brand mb-4">Resultados del test</h2>
      <div id="resultados"></div>
    </div>
  </div>

  <dialog id="modal" class="rounded-xl border border-slate-200 bg-white p-6 shadow-xl max-w-md w-full">
    <p class="font-bold text-brand mb-2">Justificación</p>
    <p id="justificacion" class="mb-4"></p>
    <form method="dialog">
      <button type="submit" class="bg-brand text-white border-brand">Cerrar</button>
    </form>
  </dialog>

  <script src="js/clase.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
